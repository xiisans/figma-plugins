<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>西西自动布局</title>
    <style>
:root {
  color-scheme: light dark;
  --bg: var(--figma-color-bg, #ffffff);
  --surface: var(--figma-color-bg-secondary, #f2f2f2);
  --surface-hover: var(--figma-color-bg-hover, #e8e8e8);
  --text: var(--figma-color-text, #1e1e1e);
  --muted: var(--figma-color-text-secondary, #6b6b6b);
  --field-label: #6f6f6f;
  --control-muted: #6f6f6f;
  --disabled: var(--figma-color-text-disabled, #b3b3b3);
  --accent: #4567ff;
  --accent-hover: #5271ff;
  --accent-soft: rgba(69, 103, 255, 0.14);
  --warning: #f49b00;
  --danger: #ef4343;
  --danger-hover: #ef4d4d;
  --danger-soft: rgba(239, 67, 67, 0.12);
  --radius: 4px;
}

* { box-sizing: border-box; }

html, body { margin: 0; min-width: 320px; background: var(--bg); }

body {
  color: var(--text);
  font: 12px/1.4 Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

button, input { font: inherit; }

.panel { padding: 12px 16px 16px; }
.section { padding: 0; }
.section-heading { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; min-height: 20px; }
.section-heading h2 { margin: 0; font-size: 14px; line-height: 20px; font-weight: 600; letter-spacing: 0; }
.section-heading span { color: var(--muted); font-size: 12px; }
.padding-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) 36px; gap: 8px; align-items: end; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field > span { color: var(--field-label); font-size: 12px; line-height: 16px; }

input {
  width: 100%;
  height: 36px;
  border: 0;
  border-radius: var(--radius);
  padding: 0 8px;
  outline: none;
  background: var(--surface);
  color: var(--text);
  transition: background-color 120ms ease, box-shadow 120ms ease;
}

input[type="number"] {
  appearance: textfield;
  -moz-appearance: textfield;
}

input[type="number"]::-webkit-outer-spin-button,
input[type="number"]::-webkit-inner-spin-button {
  margin: 0;
  -webkit-appearance: none;
}

input:hover { background: var(--surface-hover); }
input:focus { box-shadow: 0 0 0 2px var(--accent-soft); }
input.invalid { background: var(--danger-soft); box-shadow: 0 0 0 1px var(--danger); }

.lock-cell { display: flex; align-items: flex-end; justify-content: center; height: 56px; }
.lock-button {
  width: 36px;
  height: 36px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 0;
  border: 0;
  border-radius: 999px;
  outline: none;
  background: var(--surface);
  color: var(--control-muted);
  cursor: pointer;
  transition: background-color 120ms ease, color 120ms ease, box-shadow 120ms ease;
}

.lock-button svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.lock-button:hover { background: var(--surface-hover); color: var(--text); }
.lock-button:focus-visible { box-shadow: 0 0 0 2px var(--accent-soft); }
.lock-button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }

.gap-section { margin-top: 12px; }
.wide-field { max-width: none; }
.feedback { min-height: 0; margin: 0; padding: 0; border-radius: var(--radius); color: var(--muted); font-size: 12px; }
.feedback:not(:empty) { min-height: 32px; margin: 8px 0 0; padding: 8px; background: var(--surface); }
.feedback.error { color: var(--danger); background: var(--danger-soft); }
.feedback.success { color: var(--accent); background: var(--accent-soft); }

.apply-button {
  width: 100%;
  height: 36px;
  margin-top: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 0;
  border-radius: var(--radius);
  outline: none;
  background: var(--accent);
  color: #ffffff;
  cursor: pointer;
  font-size: 13px;
  font-weight: 600;
  transition: background-color 120ms ease, opacity 120ms ease;
}

.apply-button:hover { background: var(--accent-hover); }
.apply-button span { font-size: 13px; }
.apply-button:focus-visible { box-shadow: 0 0 0 2px var(--accent-soft); }
.apply-button:active { background: var(--accent); }
.apply-button:disabled { background: var(--surface); color: var(--disabled); cursor: wait; }

@media (prefers-color-scheme: dark) {
  :root {
    --bg: var(--figma-color-bg, #2c2c2c);
    --surface: var(--figma-color-bg-secondary, #383838);
    --surface-hover: var(--figma-color-bg-hover, #444444);
    --text: var(--figma-color-text, #ffffff);
    --muted: var(--figma-color-text-secondary, #b3b3b3);
    --field-label: #a3a3a3;
    --control-muted: #a3a3a3;
    --disabled: var(--figma-color-text-disabled, #6b6b6b);
  }
}

    </style>
  </head>
  <body>
    <main class="panel">
      <section class="section" aria-labelledby="padding-title">
        <div class="section-heading">
          <h2 id="padding-title">Padding</h2>
        </div>
        <div class="padding-grid">
          <label class="field field-top">
            <span>上</span>
            <input id="top" type="number" min="0" max="10000" step="1" value="16" inputmode="numeric" />
          </label>
          <label class="field field-bottom">
            <span>下</span>
            <input id="bottom" type="number" min="0" max="10000" step="1" value="16" inputmode="numeric" />
          </label>
          <div class="lock-cell">
            <button id="vertical-lock" class="lock-button" type="button" aria-pressed="false" aria-label="锁定上下 Padding" title="锁定上下 Padding">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71" />
                <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71" />
              </svg>
            </button>
          </div>
          <label class="field field-left">
            <span>左</span>
            <input id="left" type="number" min="0" max="10000" step="1" value="16" inputmode="numeric" />
          </label>
          <label class="field field-right">
            <span>右</span>
            <input id="right" type="number" min="0" max="10000" step="1" value="16" inputmode="numeric" />
          </label>
          <div class="lock-cell">
            <button id="horizontal-lock" class="lock-button" type="button" aria-pressed="false" aria-label="锁定左右 Padding" title="锁定左右 Padding">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71" />
                <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71" />
              </svg>
            </button>
          </div>
        </div>
      </section>

      <section class="section gap-section">
        <label class="field wide-field" for="gap">
          <span>Gap</span>
          <input id="gap" type="number" min="0" max="10000" step="1" value="8" inputmode="numeric" />
        </label>
      </section>

      <div id="feedback" class="feedback" role="status" aria-live="polite"></div>
      <button id="apply" class="apply-button" type="button" disabled>
        <span>请选择画板</span>
      </button>
    </main>
    <script>
(function () {
  var ids = ['top', 'right', 'bottom', 'left', 'gap'];
  var inputs = {};
  ids.forEach(function (id) { inputs[id] = document.getElementById(id); });
  var verticalLock = document.getElementById('vertical-lock');
  var horizontalLock = document.getElementById('horizontal-lock');
  var applyButton = document.getElementById('apply');
  var feedback = document.getElementById('feedback');
  var locked = { vertical: false, horizontal: false };
  var hasSelection = false;
  var isApplying = false;
  var resizeFrame = 0;
  var lastHeight = 0;

  function renderApplyButton() {
    applyButton.disabled = !hasSelection || isApplying;
    applyButton.querySelector('span').textContent = hasSelection ? '确定' : '请选择画板';
  }

  function reportSize() {
    resizeFrame = 0;
    var panel = document.querySelector('.panel');
    if (!panel) return;
    // body.scrollHeight can equal the current iframe height in Figma. Measure
    // the actual content panel instead so the window ends shortly after the button.
    var height = Math.ceil(panel.getBoundingClientRect().bottom + 4);
    if (Math.abs(height - lastHeight) < 2) return;
    lastHeight = height;
    parent.postMessage({ pluginMessage: { type: 'resize', height: height + 2 } }, '*');
  }

  function scheduleResize() {
    if (resizeFrame) return;
    resizeFrame = requestAnimationFrame(reportSize);
  }

  function setFeedback(text, kind) {
    feedback.textContent = text || '';
    feedback.className = 'feedback' + (kind ? ' ' + kind : '');
    scheduleResize();
  }

  function parseInput(input) {
    var raw = input.value.trim();
    var valid = raw !== '' && /^\d+$/.test(raw) && Number(raw) >= 0 && Number(raw) <= 10000;
    input.classList.toggle('invalid', !valid);
    return valid ? Number(raw) : null;
  }

  function sync(source, target) {
    inputs[target].value = inputs[source].value;
    inputs[target].classList.remove('invalid');
  }

  inputs.top.addEventListener('input', function () { if (locked.vertical) sync('top', 'bottom'); });
  inputs.bottom.addEventListener('input', function () { if (locked.vertical) sync('bottom', 'top'); });
  inputs.left.addEventListener('input', function () { if (locked.horizontal) sync('left', 'right'); });
  inputs.right.addEventListener('input', function () { if (locked.horizontal) sync('right', 'left'); });
  ids.forEach(function (id) { inputs[id].addEventListener('blur', function () { parseInput(inputs[id]); }); });

  if (typeof ResizeObserver === 'function') {
    new ResizeObserver(scheduleResize).observe(document.body);
  } else {
    window.addEventListener('resize', scheduleResize);
  }
  window.addEventListener('load', scheduleResize);
  scheduleResize();

  verticalLock.addEventListener('click', function () {
    locked.vertical = !locked.vertical;
    verticalLock.setAttribute('aria-pressed', String(locked.vertical));
    if (locked.vertical) sync('top', 'bottom');
  });
  horizontalLock.addEventListener('click', function () {
    locked.horizontal = !locked.horizontal;
    horizontalLock.setAttribute('aria-pressed', String(locked.horizontal));
    if (locked.horizontal) sync('left', 'right');
  });

  applyButton.addEventListener('click', function () {
    if (!hasSelection || isApplying) return;
    var values = {};
    var invalid = false;
    ids.forEach(function (id) {
      var value = parseInput(inputs[id]);
      if (value === null) invalid = true;
      values[id] = value;
    });
    if (invalid) {
      setFeedback('请填写 0 到 10000 之间的非负整数。', 'error');
      return;
    }
    isApplying = true;
    renderApplyButton();
    setFeedback('');
    parent.postMessage({ pluginMessage: { type: 'apply', values: values } }, '*');
  });

  window.onmessage = function (event) {
    var message = event.data && event.data.pluginMessage;
    if (!message) return;
    if (message.type === 'selection-state') {
      hasSelection = Boolean(message.hasSelection);
      renderApplyButton();
      if (!hasSelection) setFeedback('');
      return;
    }
    if (message.type === 'complete') {
      isApplying = false;
      renderApplyButton();
      setFeedback('');
      return;
    }
    if (message.type !== 'result') return;
    isApplying = false;
    renderApplyButton();
    if (message.summary && (message.summary.skipped || message.summary.failed)) {
      var lines = ['成功 ' + message.summary.success + '，跳过 ' + message.summary.skipped + '，失败 ' + message.summary.failed + '。'];
      (message.items || []).forEach(function (item) {
        if (item.status !== 'success') lines.push(item.name + '：' + item.reason);
      });
      setFeedback(lines.join('\n'), message.summary.success ? 'success' : 'error');
      feedback.style.whiteSpace = 'pre-line';
    } else {
      setFeedback(message.message || '处理完成。', message.ok ? 'success' : 'error');
    }
  };

  renderApplyButton();
  parent.postMessage({ pluginMessage: { type: 'ui-ready' } }, '*');
})();

    </script>
  </body>
</html>
